# A `v*` tag (admins only, enforced by the tag ruleset) publishes a GitHub Release with every
# skill zipped, for Claude apps' Settings > Capabilities > Skills upload.
name: release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Tag matches the plugin version
        run: |
          version="$(node -p "require('./.claude-plugin/plugin.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but .claude-plugin/plugin.json says ${version}"
            exit 1
          fi
      - run: npm test
      - run: npm run lint:skills
      - run: npm run pack
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
